plugins {
    id 'fabric-loom'
    id 'java'
}

def sharedProps = new Properties()
file("../../gradle.properties").withInputStream { input ->
    sharedProps.load(input)
}
sharedProps.each { key, value -> project.ext.set(key.toString(), value) }


group = sharedProps.getProperty('group')
version = sharedProps.getProperty('version')

repositories {
    maven { url "https://nexus.modl.gg/repository/maven-releases/" }
    maven { url "https://nexus.modl.gg/repository/maven-snapshots/" }
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://repo.codemc.io/repository/maven-releases/" }
    maven { url "https://repo.codemc.io/repository/maven-snapshots/" }
    maven { url "https://jitpack.io" }
    maven { url "https://repo.aikar.co/content/groups/aikar/" }
    maven { url "https://repo.alessiodp.com/snapshots/" }
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    mappings "net.fabricmc:yarn:${property('yarn_mappings')}:v2"
    modImplementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"

    // Internal modules (pre-built from main project)
    implementation files("../../bridge-core/build/libs/bridge-core-${version}.jar")
    implementation files("../../core/build/libs/core-${version}.jar")
    implementation files("../../api/build/libs/api-${version}.jar")

    // Libby runtime library loading
    implementation libs.libby.core
    implementation libs.libby.fabric

    // Compile-only deps (loaded at runtime via Libby)
    compileOnly libs.cirrus.fabric
    compileOnly libs.cirrus.api
    compileOnly libs.cirrus.common
    compileOnly libs.packetevents.api

    // Provided by server
    compileOnly libs.lamp.common
    compileOnly libs.lamp.brigadier
    compileOnly libs.lamp.fabric
    compileOnly libs.netty.all
    compileOnly libs.adventure.minimessage
    compileOnly libs.adventure.serializer.legacy
    compileOnly libs.adventure.api
    compileOnly libs.snakeyaml

    // Lombok
    compileOnly libs.lombok
    annotationProcessor libs.lombok
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

loom {
    accessWidenerPath = file("src/main/resources/modl.accesswidener")
    mods {
        create("modl") {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    from("../../LICENSE.txt") {
        rename { "LICENSE_modl.txt" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}
