pluginManagement {
    def rootGradleProperties = new Properties()
    file("../../gradle.properties").withInputStream { input ->
        rootGradleProperties.load(input)
    }

    repositories {
        maven { url "https://maven.fabricmc.net/" }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id "fabric-loom" version rootGradleProperties.getProperty("fabric.loom.version.legacy")
    }
}

dependencyResolutionManagement {
    versionCatalogs {
        create("libs") {
            from(files("../../gradle/libs.versions.toml"))
        }
    }
}

rootProject.name = "modl-fabric-121"
