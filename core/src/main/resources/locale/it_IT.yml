# Punishment type validation messages
validation:
  single_severity_error: "&cImpossibile impostare la gravità sul tipo di punizione a gravità unica '{type}'. Questo tipo di punizione ha un solo livello di gravità."
  permanent_skin_change_error: "&cImpossibile impostare la gravità sul tipo di punizione permanente fino al cambio della skin '{type}'."
  permanent_username_change_error: "&cImpossibile impostare la gravità sul tipo di punizione permanente fino al cambio del nome utente '{type}'."
  alt_blocking_not_supported: "&cIl blocco degli alt non è supportato per il tipo di punizione '{type}'."
  stat_wiping_not_supported: "&cL'azzeramento delle statistiche non è supportato per il tipo di punizione '{type}'."

# Punishment placeholder words
# These are substituted into punishment messages as {tense}, {tense2}, and {temp}
punishment_words:
  # {tense} - used in player-facing messages (e.g., "You {tense} banned")
  tense_default: "Sei stato"
  tense_active: "Sei"
  # {tense2} - used in player-facing messages (e.g., "Your account {tense2} restricted")
  tense2_default: "è stato"
  tense2_active: "è"
  # {temp} - used in player-facing messages (e.g., "You have been {temp} banned")
  temporarily: "temporaneamente"
  permanently: "permanentemente"
  # {will_expire} - appended to timed ban/mute notifications; {type} is ban/mute/punishment, {duration} is the remaining time
  will_expire: "\n&7Questo {type} scadrà tra &f{duration}&7."
  duration_formatted: "\n&7Questo {type} scadrà tra {duration}"
  mute_duration_formatted: " per {duration}"
  # {for_duration} - appended to timed mute notifications; the value carries its own leading space
  for_duration: " per {duration}"
  # Localized words injected as {type} into will_expire/duration_formatted
  type_ban: "ban"
  type_mute: "mute"
  type_punishment: "provvedimento"
  # Shown in the {duration} slot for permanent punishments; config.yml locale_config.duration_format.permanent overrides it when set
  duration_permanent: "permanente"

# Punishment Type Specific Messages
# Format: punishment_types.ordinal_<ordinal_number>
# Manual punishment types (ordinals 0-5):
#   0: Kick, 1: Manual Mute, 2: Manual Ban, 3: Security Ban, 4: Linked Ban, 5: Blacklist
# Dynamic punishment types start at ordinal 6+
#
# Structure:
#   public_notification: Single message shown to all players
#   player_notification: List of strings shown to the punished player (joined by \n)
#   Available placeholders:
#     {target} - The player's name (usually "You" for player notifications)
#     {reason} - The punishment reason
#     {duration} - Duration formatted (e.g., "7d 3h" or "permanent")
#     {description} - Same as reason
#     {appeal_url} - Full appeal URL (api.url + /appeal)
#     {id} - The punishment ID
#     {temp} - "temporarily" or "permanently"
#     {issued} - Issue date in MM/DD/YY HH:MM format
#     {player_description} - Player-facing description from punishment type config
#     {will_expire} - Empty if permanent, or "\nThis ban/mute will expire in {duration}" if timed
#     {issuer} - Staff name who issued the punishment
#     {tense} - "have been" or "are" depending on context
#     {tense2} - "has been" or "is" depending on context

punishments:
  public_notification:
    ban_default: "&c{target} è stato bannato."
    mute_default: "&c{target} è stato mutato."
    kick_default: "&c{target} è stato kickato."
    default: "&c{target} è stato punito."
  mute_fallback: "&cSei mutato!"
  player_notification:
    ban_default: "&c{tense} bannato (#{id})."
    mute_default: "&c{tense} mutato (#{id})."
    kick_default: "&cSei stato kickato (#{id})."
    default: "&c{tense} punito (#{id})."

punishment_types:
  ordinal_0: # Kick
    public_notification: "&c{target} è stato kickato."
    player_notification:
      - "&c&lSei stato kickato dal server."
      - "&f{reason} &7(#{id})"

  ordinal_1: # Manual Mute
    public_notification: "&c{target} è stato mutato."
    player_notification:
      - ""
      - "&c{tense} mutato {temp}{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{reason}"
      - ""

  ordinal_2: # Manual Ban
    public_notification: "&c{target} è stato bannato."
    player_notification:
      - "&c&l{tense} bannato {temp} per:"
      - ""
      - "&f{reason}"
      - "&7{will_expire}"
      - "&7Pensi si tratti di un errore? Fai ricorso su {appeal_url} usando l'ID #{id}."

  # Manual punishment types
  ordinal_3:  # Security Ban
    public_notification: "&c{target} è stato bannato."
    player_notification:
      - "&c&lIl tuo account {tense2} limitato per motivi di sicurezza."
      - "&fÈ stata rilevata attività sospetta sul tuo account. Metti al sicuro il tuo account e apri un ricorso su {appeal_url} usando l'ID #{id}."

  ordinal_4:  # Linked Ban
    public_notification: "&c{target} è stato bannato."
    player_notification:
      - "&c&lIl tuo account {tense2} collegato a un account bannato."
      - ""
      - "&fEludere i ban usando account alternativi o condividere il proprio account è severamente vietato."
      - ""
      - "&7Questo ban verrà revocato automaticamente alla scadenza del ban collegato."
      - "&7Pensi si tratti di un errore? Fai ricorso su {appeal_url} usando l'ID #{id}"

  ordinal_5:  # Blacklist
    public_notification: "&c{target} è stato inserito nella blacklist."
    player_notification:
      - "&c{tense} inserito nella blacklist"
      - "&7ID: #{id}"

  ordinal_6: # Chat abuse
    public_notification: "&c{target} è stato mutato per abuso della chat."
    player_notification:
      - ""
      - "&c{tense} mutato {temp}{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""
  ordinal_7: # anti social
    public_notification: "&c{target} è stato mutato per comportamento antisociale."
    player_notification:
      - ""
      - "&c{tense} mutato {temp}{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""

  ordinal_8: # targeting
    public_notification: "&c{target} è stato bannato per accanimento verso altri giocatori."
    player_notification:
      - "&c&l{tense} bannato {temp} per:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Pensi si tratti di un errore? Fai ricorso su {appeal_url} usando l'ID #{id}."

  ordinal_9: # bad content
    public_notification: "&c{target} è stato bannato per contenuti inappropriati."
    player_notification:
      - "&c&l{tense} bannato {temp} per:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Pensi si tratti di un errore? Fai ricorso su {appeal_url} usando l'ID #{id}."

  ordinal_10: # Bad username
    public_notification: "&c{target} è stato bannato."
    player_notification:
      - "&c&l{tense} bannato a causa del tuo nome utente Minecraft."
      - ""
      - "&f{reason}"
      - ""
      - "&7Questo ban verrà revocato automaticamente quando cambierai nome utente."
      - "&7Pensi si tratti di un errore? Fai ricorso su {appeal_url} usando l'ID #{id}"

  ordinal_11: # Bad skin
    public_notification: "&c{target} è stato bannato."
    player_notification:
      - "&c&l{tense} bannato a causa della tua skin di Minecraft."
      - ""
      - "&f{reason}"
      - ""
      - "&7Questo ban verrà revocato automaticamente quando cambierai skin."
      - "&7Pensi si tratti di un errore? Fai ricorso su {appeal_url} usando l'ID #{id}"

  ordinal_12: # team abuse
    public_notification: "&c{target} è stato bannato per abuso del team."
    player_notification:
      - "&c&l{tense} bannato {temp} per:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Pensi si tratti di un errore? Fai ricorso su {appeal_url} usando l'ID #{id}."

  ordinal_13: # game abuse
    public_notification: "&c{target} è stato bannato per abuso di gioco."
    player_notification:
      - "&c&l{tense} bannato {temp} per:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Pensi si tratti di un errore? Fai ricorso su {appeal_url} usando l'ID #{id}."

  ordinal_14: # cheating
    public_notification: "&c{target} è stato bannato per cheating."
    player_notification:
      - "&c&l{tense} bannato {temp} per:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Pensi si tratti di un errore? Fai ricorso su {appeal_url} usando l'ID #{id}."

  ordinal_15: # game trading
    public_notification: "&c{target} è stato bannato per scambi di gioco non consentiti."
    player_notification:
      - "&c&l{tense} bannato {temp} per:"
      - ""
