# Warning Command Messages
warn:
  player_message: "&c&lHai ricevuto un avvertimento da {issuer}.\n&fMotivo: &7{reason}\n&7Rileggi le regole del server e comportati di conseguenza."
  success: "&a&f{target}&a avvertito con successo per: &7{reason}"
  staff_notification: "&7&o[{issuer}: ha avvertito {target} per {reason}&7&o]"
  error: "&cImpossibile creare l'avvertimento: {error}"

# Menu Item Localization
# These define titles and lore for items in inspect menus
# Available placeholders vary by item type and are documented below
menus:
  # Player head in inspect menus
  player_head:
    title: "&6Informazioni di {player_name}"
    lore:
      - "&8{uuid}"
      - "&f "
      - "&7Primo accesso: &f{first_login}"
      - "&7Online: {is_online} ({last_seen_or_session_time} su {server})"
      - "&7Tempo di gioco: &f{playtime}"
      - "&7IP reale registrato: &f{real_ip_logged}"
      - "&7Regione: &f{region} (Paese: {country})"
      - "&7Bannato: &f{is_banned}"
      - "&7Mutato: &f{is_muted}"
      - ""
      - "&eClic sinistro per impostare {player_name} come bersaglio"

  # Punishment history items
  history_item:
    title_active: "&f&l{punishment_type} &f({initial_duration_if_not_kick}{space_ban_mute_or_kick})"
    title_inactive: "&m&f&l{punishment_type} &f({initial_duration_if_not_kick}{space_ban_mute_or_kick})"
    lore:
      - "&7{status_line}"
      - "&f "
      - "{notes}"
      - "&f "
      - "&7Server: &f{issued_server}"
      - "&7ID: &c{punishment_id}"
      - "&bClicca per modificare questa punizione."
    status_active: "&7Scade tra {expiry}."
    status_inactive: "&7Scaduta {expired} fa."
    status_pardoned: "&7Revocata {pardoned} fa."
    status_permanent: "&7&7Questa punizione permanente non scadrà mai."
    status_unstarted: "&7Punizione non ancora iniziata."
    note_format: "&e{note_date} {note_issuer}&f: {note}"

  # Recent punishments items (includes target player info)
  recent_item:
    title_active: "&f&l{punishment_type} &f({initial_duration_if_not_kick}{space_ban_mute_or_kick})"
    title_inactive: "&m&f&l{punishment_type} &f({initial_duration_if_not_kick}{space_ban_mute_or_kick})"
    lore:
      - "&7Giocatore: &f{player}"
      - "&7{status_line}"
      - "&f "
      - "{notes}"
      - "&f "
      - "&7Server: &f{issued_server}"
      - "&7ID: &c{punishment_id}"
      - "&bClicca per modificare questa punizione."

  # Note items
  note_item:
    title: "&e{date} {author}"
    lore:
      - "&f{content}"
      - "&f "
      - "&eClicca per vedere la nota in chat"

  # Report items
  report_item:
    title: "&e{date} {id} ({status}&e)"
    lore:
      - "&7Segnalato da &a{reporter} &7({type})"
      - "&f "
      - "{content}"
      - "&f "
      - "&cClic sinistro per ispezionare il giocatore"
      - "&aClic destro per archiviare la segnalazione"

  # Alt account items
  alt_item:
    title: "{color}{player_name}"
    lore:
      - "&8{uuid}"
      - "&f "
      - "&7Online: {is_online} ({last_seen_or_session_time} su {server})"
      - "&7IP reale registrato: {real_ip}"
      - "&7Primo accesso: &f{first_login}"
      - "&7{punishments}"
      - "&f "
      - "&eClicca per ispezionare {player_name}"
    punishment_line_active_true:
      - "&7Punizioni attive ({active_count}): &f"
      - "{active_punishment_list}"
    punishment_line_active_false:
      - "&7Punizioni attive: &f0"
      - "&7Punizioni inattive: &f{inactive_count}"
    active_punishment_format: "&7- &e#{punishment_id} {punishment_date}: {punishment_type} ({punishment_remaining})"


  # Empty placeholders for lists
  empty:
    history: "Nessuno storico delle punizioni"
    notes: "Nessuna nota dello staff"
    reports: "Nessuna segnalazione presentata"
    alts: "Nessun account collegato"
    tickets: "Nessun ticket"
    staff_reports: "Nessuna segnalazione"

  # Staff menu - Tickets
  ticket_item:
    title: "&6Ticket #{id}"
    lore:
      - "&7Giocatore: &f{player}"
      - "&7Titolo: &f{title}"
      - "&7Creato: &f{date}"
      - "&7Stato: {status}"
      - "&f "
      - "&eClicca per aprirlo nel pannello"

  # Staff menu - Reports
  staff_report_item:
    title: "&e{date} {id} ({status}&e)"
    lore:
      - "&c{reported}&7 segnalato da &a{reporter} &7({type})"
      - "&f "
      - "{content}"
      - "&f "
      - "&cClic sinistro per ispezionare il giocatore"
      - "&aClic destro per archiviare la segnalazione"
  linked_ticket_item:
    title: "&e{date} {id} ({status}&e)"
    lore:
      - "&7{title}"
      - "&f "
      - "{content}"
  link_report_item_unselected:
    title: "&e{date} {id}"
    lore:
      - "&7Segnalato da &a{reporter} &7({type})"
      - "&f "
      - "{content}"
      - "&f "
      - "&eClicca per selezionare"
  link_report_item_selected:
    title: "&a{date} {id}"
    lore:
      - "&7Segnalato da &a{reporter} &7({type})"
      - "&f "
      - "{content}"
      - "&f "
      - "&eClicca per deselezionare"

  # Staff Members Menu (lore template for each staff entry)
  # Placeholders: {display_name}, {online_color}, {role}, {minecraft_username},
  #   {online_status}, {session_duration}, {last_seen}, {playtime}, {punishments_count}
  staff_members:
    title: "&e{panel_name}"
    lore:
      - "&7Ruolo: &f{role}"
      - "&7Minecraft: &f{minecraft_username}"
      - ""
      - "&7Online: {is_online} ({last_seen_or_session_time} su {server})"
      - "&7Tempo di gioco: &f{playtime}"
      - "&7Punizioni emesse: &f{punishments_count}"

  notes:
    created: "&aNota creata con successo!"
    create_failed: "&cImpossibile creare la nota."
    cancelled: "&7Creazione della nota annullata."
  modify_punishment:
    no_permission_tickets: "&cNon hai il permesso di modificare i ticket collegati."
    no_changes: "&7Nessuna modifica ai ticket collegati."
    tickets_updated: "&aTicket collegati aggiornati con successo!"
    tickets_update_failed: "&cImpossibile aggiornare i ticket collegati."

  # Online Players Menu (lore template for each player entry)
  # Placeholders: {player_name}, {session_duration}, {total_playtime}, {punishments}, {report_count}
  online_players:
    title: "&6{player_name}"
    lore:
      - "&7Sessione: &f{session_duration}"
      - "&7Tempo di gioco totale: &f{total_playtime}"
      - "&7Punizioni: &f{punishments}"
      - ""
      - "&7Segnalazioni ({report_count}):"
      - "{report-list}"
      - ""
      - "&cClic sinistro per ispezionare"
      - "&aClic destro per impostare come bersaglio"
    # Placeholders: {date}, {details}, {reporter}
    report_entry: " &6- &e{date} {reporter}: &f{details}"
    reports_more: " &e... e altre {count}"
    no_reports: " &eNessuna segnalazione"

# Help Command
# Set usage to "" to hide a command from the help list (e.g. if you disabled it).
help:
  header: "&a&lmodl.gg &av{version} &f- &eLista dei comandi"
  entry: "&f/{command} &7- {description}"
  footer: "&ePagina {page}/{total_pages}. Usa &a/modl help {next_page}&e per la pagina successiva."
  no_more_pages: "&7Nessun'altra pagina."
  player_commands:
    iammuted:
      usage: "iammuted <giocatore>"
      description: "Comunica a qualcuno che sei mutato"
    standing:
      usage: "standing"
      description: "Visualizza la tua reputazione"
    report:
      usage: "report <giocatore> <motivo>"
      description: "Segnala un giocatore"
    chatreport:
      usage: "chatreport <giocatore>"
      description: "Segnala la chat di un giocatore"
    claimticket:
      usage: "claimticket <id>"
      description: "Collega un ticket al tuo account"
    apply:
      usage: "apply"
      description: "Candidati per un ruolo nello staff"
    bugreport:
      usage: "bugreport"
      description: "Segnala un bug"
    support:
      usage: "support"
      description: "Apri un ticket di supporto"
  staff_commands:
    staffmenu:
      usage: "staffmenu"
      description: "Apri il menu dello staff"
    inspect:
      usage: "inspect <giocatore> [-p]"
      description: "Apri il menu di ispezione del giocatore (-p per il testo)"
    history:
      usage: "history <giocatore> [-p [pagina]]"
      description: "Apri lo storico del giocatore (-p per il testo)"
    notes:
      usage: "notes <giocatore> [-p [pagina]]"
      description: "Apri le note del giocatore (-p per il testo)"
    alts:
      usage: "alts <giocatore> [-p [pagina]]"
      description: "Apri gli alt del giocatore (-p per il testo)"
    reports:
      usage: "reports [giocatore] [-p [pagina]]"
      description: "Apri il menu delle segnalazioni (-p per il testo)"
    punish:
      usage: "punish <giocatore> [tipo] [motivo]"
      description: "Applica una punizione"
    ban:
      usage: "ban <giocatore> [durata] [motivo]"
      description: "Banna un giocatore"
    mute:
      usage: "mute <giocatore> [durata] [motivo]"
      description: "Muta un giocatore"
    kick:
      usage: "kick <giocatore> [motivo]"
      description: "Kicka un giocatore"
    blacklist:
      usage: "blacklist <giocatore> [motivo]"
      description: "Inserisci un giocatore nella blacklist"
    pardon:
      usage: "pardon <giocatore>"
      description: "Revoca TUTTE le punizioni attive"
    unban:
      usage: "unban <giocatore>"
      description: "Revoca il ban attivo o il più vecchio non ancora iniziato"
    unmute:
      usage: "unmute <giocatore>"
      description: "Revoca il mute attivo o il più vecchio non ancora iniziato"
    replay:
      usage: "replay <status|capture> [giocatore]"
      description: "Gestisci le registrazioni dei replay"
    modl_reload:
      usage: "modl reload"
      description: "Ricarica la configurazione"

