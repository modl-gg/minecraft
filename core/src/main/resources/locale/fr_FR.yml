  stat_wiping_not_supported: "&cLa réinitialisation des statistiques n'est pas prise en charge pour le type de sanction '{type}'."

# Punishment placeholder words
# These are substituted into punishment messages as {tense}, {tense2}, and {temp}
punishment_words:
  # {tense} - used in player-facing messages (e.g., "You {tense} banned")
  tense_default: "as été"
  tense_active: "es"
  # {tense2} - used in player-facing messages (e.g., "Your account {tense2} restricted")
  tense2_default: "a été"
  tense2_active: "est"
  # {temp} - used in player-facing messages (e.g., "You have been {temp} banned")
  temporarily: "temporairement"
  permanently: "définitivement"
  # {will_expire} - appended to timed ban/mute notifications; {type} is ban/mute/punishment, {duration} is the remaining time
  will_expire: "\n&7Il te reste &f{duration}&7 de {type}."
  duration_formatted: "\n&7Il te reste {duration} de {type}"
  mute_duration_formatted: " pour {duration}"
  # {for_duration} - appended to timed mute notifications; the value carries its own leading space
  for_duration: " pour {duration}"
  # Localized words injected as {type} into will_expire/duration_formatted
  type_ban: "ban"
  type_mute: "mute"
  type_punishment: "sanction"
  # Shown in the {duration} slot for permanent punishments; config.yml locale_config.duration_format.permanent overrides it when set
  duration_permanent: "permanent"

# Punishment Type Specific Messages
# Format: punishment_types.ordinal_<ordinal_number>
# Manual punishment types (ordinals 0-5):
#   0: Kick, 1: Manual Mute, 2: Manual Ban, 3: Security Ban, 4: Linked Ban, 5: Blacklist
# Dynamic punishment types start at ordinal 6+
# 
# Structure:
#   public_notification: Single message shown to all players
#   player_notification: List of strings shown to the punished player (joined by \n)
#   Available placeholders:
#     {target} - The player's name (usually "You" for player notifications)
#     {reason} - The punishment reason
#     {duration} - Duration formatted (e.g., "7d 3h" or "permanent")
#     {description} - Same as reason
#     {appeal_url} - Full appeal URL (api.url + /appeal)
#     {id} - The punishment ID
#     {temp} - "temporarily" or "permanently"
#     {issued} - Issue date in MM/DD/YY HH:MM format
#     {player_description} - Player-facing description from punishment type config
#     {will_expire} - Empty if permanent, or "\nThis ban/mute will expire in {duration}" if timed
#     {issuer} - Staff name who issued the punishment
#     {tense} - "have been" or "are" depending on context
#     {tense2} - "has been" or "is" depending on context

punishments:
  public_notification:
    ban_default: "&c{target} a été banni."
    mute_default: "&c{target} a été mute."
    kick_default: "&c{target} a été expulsé."
    default: "&c{target} a été sanctionné."
  mute_fallback: "&cTu es mute !"
  player_notification:
    ban_default: "&cTu {tense} banni (#{id})."
    mute_default: "&cTu {tense} mute (#{id})."
    kick_default: "&cTu as été expulsé (#{id})."
    default: "&cTu {tense} sanctionné (#{id})."

punishment_types:
  ordinal_0: # Kick
    public_notification: "&c{target} a été expulsé."
    player_notification:
      - "&c&lTu as été expulsé du serveur."
      - "&f{reason} &7(#{id})"

  ordinal_1: # Manual Mute
    public_notification: "&c{target} a été mute."
    player_notification:
      - ""
      - "&cTu {tense} {temp} mute{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{reason}"
      - ""

  ordinal_2: # Manual Ban
    public_notification: "&c{target} a été banni."
    player_notification:
      - "&c&lTu {tense} {temp} banni pour :"
      - ""
      - "&f{reason}"
      - "&7{will_expire}"
      - "&7Tu penses qu'il s'agit d'une erreur ? Fais appel sur {appeal_url} avec l'ID #{id}."

  # Manual punishment types
  ordinal_3:  # Security Ban
    public_notification: "&c{target} a été banni."
    player_notification:
      - "&c&lTon compte {tense2} restreint pour des raisons de sécurité."
      - "&fUne activité suspecte a été détectée sur ton compte. Sécurise ton compte et fais appel sur {appeal_url} avec l'ID #{id}."

  ordinal_4:  # Linked Ban
    public_notification: "&c{target} a été banni."
    player_notification:
      - "&c&lTon compte {tense2} lié à un compte banni."
      - ""
      - "&fContourner un bannissement en utilisant des comptes secondaires ou en partageant ton compte est strictement interdit."
      - ""
      - "&7Ce bannissement sera automatiquement levé à l'expiration du bannissement lié."
      - "&7Tu penses qu'il s'agit d'une erreur ? Fais appel sur {appeal_url} avec l'ID #{id}"

  ordinal_5:  # Blacklist
    public_notification: "&c{target} a été blacklisté."
    player_notification:
      - "&cTu {tense} blacklisté"
      - "&7ID : #{id}"

  ordinal_6: # Chat abuse
    public_notification: "&c{target} a été mute pour abus dans le chat."
    player_notification:
      - ""
      - "&cTu {tense} {temp} mute{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""
  ordinal_7: # anti social
    public_notification: "&c{target} a été mute pour comportement antisocial."
    player_notification:
      - ""
      - "&cTu {tense} {temp} mute{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""

  ordinal_8: # targeting
    public_notification: "&c{target} a été banni pour harcèlement ciblé."
    player_notification:
      - "&c&lTu {tense} {temp} banni pour :"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Tu penses qu'il s'agit d'une erreur ? Fais appel sur {appeal_url} avec l'ID #{id}."

  ordinal_9: # bad content
    public_notification: "&c{target} a été banni pour contenu inapproprié."
    player_notification:
      - "&c&lTu {tense} {temp} banni pour :"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Tu penses qu'il s'agit d'une erreur ? Fais appel sur {appeal_url} avec l'ID #{id}."

  ordinal_10: # Bad username
    public_notification: "&c{target} a été banni."
    player_notification:
      - "&c&lTu {tense} banni en raison de ton pseudo Minecraft."
      - ""
