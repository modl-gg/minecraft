# Warning Command Messages
warn:
  player_message: "&c&lTu as reçu un avertissement de {issuer}.\n&fRaison : &7{reason}\n&7Relis les règles du serveur et adapte ton comportement en conséquence."
  success: "&a&f{target}&a averti avec succès pour : &7{reason}"
  staff_notification: "&7&o[{issuer} : a averti {target} pour {reason}&7&o]"
  error: "&cÉchec de la création de l'avertissement : {error}"

# Menu Item Localization
# These define titles and lore for items in inspect menus
# Available placeholders vary by item type and are documented below
menus:
  # Player head in inspect menus
  player_head:
    title: "&6Informations de {player_name}"
    lore:
      - "&8{uuid}"
      - "&f "
      - "&7Première connexion : &f{first_login}"
      - "&7En ligne : {is_online} ({last_seen_or_session_time} sur {server})"
      - "&7Temps de jeu : &f{playtime}"
      - "&7IP réelle enregistrée : &f{real_ip_logged}"
      - "&7Région : &f{region} (Pays : {country})"
      - "&7Banni : &f{is_banned}"
      - "&7Mute : &f{is_muted}"
      - ""
      - "&eClic gauche pour cibler {player_name}"

  # Punishment history items
  history_item:
    title_active: "&f&l{punishment_type} &f({initial_duration_if_not_kick}{space_ban_mute_or_kick})"
    title_inactive: "&m&f&l{punishment_type} &f({initial_duration_if_not_kick}{space_ban_mute_or_kick})"
    lore:
      - "&7{status_line}"
      - "&f "
      - "{notes}"
      - "&f "
      - "&7Serveur : &f{issued_server}"
      - "&7ID : &c{punishment_id}"
      - "&bClique pour modifier cette sanction."
    status_active: "&7Expire dans {expiry}."
    status_inactive: "&7Expirée il y a {expired}."
    status_pardoned: "&7Révoquée il y a {pardoned}."
    status_permanent: "&7&7Cette sanction permanente n'expirera jamais."
    status_unstarted: "&7Sanction pas encore commencée."
    note_format: "&e{note_date} {note_issuer}&f : {note}"

  # Recent punishments items (includes target player info)
  recent_item:
    title_active: "&f&l{punishment_type} &f({initial_duration_if_not_kick}{space_ban_mute_or_kick})"
    title_inactive: "&m&f&l{punishment_type} &f({initial_duration_if_not_kick}{space_ban_mute_or_kick})"
    lore:
      - "&7Joueur : &f{player}"
      - "&7{status_line}"
      - "&f "
      - "{notes}"
      - "&f "
      - "&7Serveur : &f{issued_server}"
      - "&7ID : &c{punishment_id}"
      - "&bClique pour modifier cette sanction."

  # Note items
  note_item:
    title: "&e{date} {author}"
    lore:
      - "&f{content}"
      - "&f "
      - "&eClique pour voir la note dans le chat"

  # Report items
  report_item:
    title: "&e{date} {id} ({status}&e)"
    lore:
      - "&7Signalé par &a{reporter} &7({type})"
      - "&f "
      - "{content}"
      - "&f "
      - "&cClic gauche pour inspecter le joueur"
      - "&aClic droit pour rejeter le signalement"

  # Alt account items
  alt_item:
    title: "{color}{player_name}"
    lore:
      - "&8{uuid}"
      - "&f "
      - "&7En ligne : {is_online} ({last_seen_or_session_time} sur {server})"
      - "&7IP réelle enregistrée : {real_ip}"
      - "&7Première connexion : &f{first_login}"
      - "&7{punishments}"
      - "&f "
      - "&eClique pour inspecter {player_name}"
    punishment_line_active_true:
      - "&7Sanctions actives ({active_count}) : &f"
      - "{active_punishment_list}"
    punishment_line_active_false:
      - "&7Sanctions actives : &f0"
      - "&7Sanctions inactives : &f{inactive_count}"
    active_punishment_format: "&7- &e#{punishment_id} {punishment_date} : {punishment_type} ({punishment_remaining})"


  # Empty placeholders for lists
  empty:
    history: "Aucun historique de sanctions"
    notes: "Aucune note du staff"
    reports: "Aucun signalement déposé"
    alts: "Aucun compte lié"
    tickets: "Aucun ticket"
    staff_reports: "Aucun signalement"

  # Staff menu - Tickets
  ticket_item:
    title: "&6Ticket #{id}"
    lore:
      - "&7Joueur : &f{player}"
      - "&7Titre : &f{title}"
      - "&7Créé le : &f{date}"
      - "&7Statut : {status}"
      - "&f "
      - "&eClique pour ouvrir dans le panel"

  # Staff menu - Reports
  staff_report_item:
    title: "&e{date} {id} ({status}&e)"
    lore:
      - "&c{reported}&7 signalé par &a{reporter} &7({type})"
      - "&f "
      - "{content}"
      - "&f "
      - "&cClic gauche pour inspecter le joueur"
      - "&aClic droit pour rejeter le signalement"
  linked_ticket_item:
    title: "&e{date} {id} ({status}&e)"
    lore:
      - "&7{title}"
      - "&f "
      - "{content}"
  link_report_item_unselected:
    title: "&e{date} {id}"
    lore:
      - "&7Signalé par &a{reporter} &7({type})"
      - "&f "
      - "{content}"
      - "&f "
      - "&eClique pour sélectionner"
  link_report_item_selected:
    title: "&a{date} {id}"
    lore:
      - "&7Signalé par &a{reporter} &7({type})"
      - "&f "
      - "{content}"
      - "&f "
      - "&eClique pour désélectionner"

  # Staff Members Menu (lore template for each staff entry)
  # Placeholders: {display_name}, {online_color}, {role}, {minecraft_username},
  #   {online_status}, {session_duration}, {last_seen}, {playtime}, {punishments_count}
  staff_members:
    title: "&e{panel_name}"
    lore:
      - "&7Rôle : &f{role}"
      - "&7Minecraft : &f{minecraft_username}"
      - ""
      - "&7En ligne : {is_online} ({last_seen_or_session_time} sur {server})"
      - "&7Temps de jeu : &f{playtime}"
      - "&7Sanctions émises : &f{punishments_count}"

  notes:
    created: "&aNote créée avec succès !"
    create_failed: "&cÉchec de la création de la note."
    cancelled: "&7Création de la note annulée."
  modify_punishment:
    no_permission_tickets: "&cTu n'as pas la permission de modifier les tickets liés."
    no_changes: "&7Aucune modification des tickets liés."
    tickets_updated: "&aTickets liés mis à jour avec succès !"
    tickets_update_failed: "&cÉchec de la mise à jour des tickets liés."

  # Online Players Menu (lore template for each player entry)
  # Placeholders: {player_name}, {session_duration}, {total_playtime}, {punishments}, {report_count}
  online_players:
    title: "&6{player_name}"
    lore:
      - "&7Session : &f{session_duration}"
      - "&7Temps de jeu total : &f{total_playtime}"
      - "&7Sanctions : &f{punishments}"
      - ""
      - "&7Signalements ({report_count}) :"
      - "{report-list}"
      - ""
      - "&cClic gauche pour inspecter"
      - "&aClic droit pour cibler"
    # Placeholders: {date}, {details}, {reporter}
    report_entry: " &6- &e{date} {reporter} : &f{details}"
    reports_more: " &e... et {count} de plus"
    no_reports: " &eAucun signalement"

# Help Command
# Set usage to "" to hide a command from the help list (e.g. if you disabled it).
help:
  header: "&a&lmodl.gg &av{version} &f- &eListe des commandes"
  entry: "&f/{command} &7- {description}"
  footer: "&ePage {page}/{total_pages}. Utilise &a/modl help {next_page}&e pour la page suivante."
  no_more_pages: "&7Aucune autre page."
  player_commands:
    iammuted:
      usage: "iammuted <joueur>"
      description: "Indiquer à quelqu'un que tu es mute"
    standing:
      usage: "standing"
      description: "Voir l'état de tes sanctions"
    report:
      usage: "report <joueur> <raison>"
      description: "Signaler un joueur"
    chatreport:
      usage: "chatreport <joueur>"
      description: "Signaler le chat d'un joueur"
    claimticket:
      usage: "claimticket <id>"
      description: "Lier un ticket à ton compte"
    apply:
      usage: "apply"
      description: "Postuler pour un poste dans le staff"
    bugreport:
      usage: "bugreport"
      description: "Signaler un bug"
    support:
      usage: "support"
      description: "Ouvrir un ticket de support"
  staff_commands:
    staffmenu:
      usage: "staffmenu"
      description: "Ouvrir le menu du staff"
    inspect:
      usage: "inspect <joueur> [-p]"
      description: "Ouvrir le menu d'inspection du joueur (-p pour le texte)"
    history:
      usage: "history <joueur> [-p [page]]"
      description: "Ouvrir l'historique du joueur (-p pour le texte)"
    notes:
      usage: "notes <joueur> [-p [page]]"
      description: "Ouvrir les notes du joueur (-p pour le texte)"
    alts:
      usage: "alts <joueur> [-p [page]]"
      description: "Ouvrir les comptes liés du joueur (-p pour le texte)"
    reports:
      usage: "reports [joueur] [-p [page]]"
      description: "Ouvrir le menu des signalements (-p pour le texte)"
    punish:
      usage: "punish <joueur> [type] [raison]"
      description: "Appliquer une sanction"
    ban:
      usage: "ban <joueur> [durée] [raison]"
      description: "Bannir un joueur"
    mute:
      usage: "mute <joueur> [durée] [raison]"
      description: "Mute un joueur"
    kick:
      usage: "kick <joueur> [raison]"
      description: "Expulser un joueur"
    blacklist:
      usage: "blacklist <joueur> [raison]"
      description: "Blacklister un joueur"
    pardon:
      usage: "pardon <joueur>"
      description: "Révoquer TOUTES les sanctions actives"
    unban:
      usage: "unban <joueur>"
      description: "Révoquer le ban actif ou le plus ancien non commencé"
    unmute:
      usage: "unmute <joueur>"
      description: "Révoquer le mute actif ou le plus ancien non commencé"
    replay:
      usage: "replay <status|capture> [joueur]"
      description: "Gérer les enregistrements de replay"
    modl_reload:
      usage: "modl reload"
      description: "Recharger la configuration"

