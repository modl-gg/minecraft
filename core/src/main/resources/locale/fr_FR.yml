# Punishment type validation messages
validation:
  single_severity_error: "&cImpossible de définir une gravité pour le type de sanction '{type}'. Ce type de sanction n'a qu'un seul niveau de gravité."
  permanent_skin_change_error: "&cImpossible de définir une gravité pour le type de sanction '{type}' (permanent jusqu'au changement de skin)."
  permanent_username_change_error: "&cImpossible de définir une gravité pour le type de sanction '{type}' (permanent jusqu'au changement de pseudo)."
