      - ""
      - "&7Этот бан будет автоматически снят после смены скина."
      - "&7Считаете это ошибкой? Подайте апелляцию на {appeal_url}, указав ID #{id}"

  ordinal_12: # team abuse
    public_notification: "&cИгрок {target} забанен за нарушения в командной игре."
    player_notification:
      - "&c&lВы {tense} {temp} забанены за:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Считаете это ошибкой? Подайте апелляцию на {appeal_url}, указав ID #{id}."

  ordinal_13: # game abuse
    public_notification: "&cИгрок {target} забанен за нарушения игрового процесса."
    player_notification:
      - "&c&lВы {tense} {temp} забанены за:"
