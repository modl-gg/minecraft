# Punishment type validation messages
validation:
  single_severity_error: "&cНевозможно указать степень тяжести для типа наказания '{type}' с единственной степенью. У этого типа наказания только один уровень тяжести."
  permanent_skin_change_error: "&cНевозможно указать степень тяжести для типа наказания '{type}', действующего до смены скина."
  permanent_username_change_error: "&cНевозможно указать степень тяжести для типа наказания '{type}', действующего до смены никнейма."
  alt_blocking_not_supported: "&cФлаг блокировки альт-аккаунтов не поддерживается типом наказания '{type}'."
  stat_wiping_not_supported: "&cФлаг сброса статистики не поддерживается типом наказания '{type}'."

# Punishment placeholder words
# These are substituted into punishment messages as {tense}, {tense2}, and {temp}
punishment_words:
  # {tense} - used in player-facing messages (e.g., "You {tense} banned")
  tense_default: "были"
  tense_active: "сейчас"
  # {tense2} - used in player-facing messages (e.g., "Your account {tense2} restricted")
  tense2_default: "был"
  tense2_active: "сейчас"
  # {temp} - used in player-facing messages (e.g., "You have been {temp} banned")
  temporarily: "временно"
  permanently: "навсегда"
  # {will_expire} - appended to timed ban/mute notifications; {type} is ban/mute/punishment, {duration} is the remaining time
  will_expire: "\n&7Срок действия ({type}) истечёт через &f{duration}&7."
  duration_formatted: "\n&7Срок действия ({type}) истечёт через {duration}"
  mute_duration_formatted: " на {duration}"
  # {for_duration} - appended to timed mute notifications; the value carries its own leading space
  for_duration: " на {duration}"
  # Localized words injected as {type} into will_expire/duration_formatted
  type_ban: "бан"
  type_mute: "мут"
  type_punishment: "наказание"
  # Shown in the {duration} slot for permanent punishments; config.yml locale_config.duration_format.permanent overrides it when set
  duration_permanent: "навсегда"

# Punishment Type Specific Messages
# Format: punishment_types.ordinal_<ordinal_number>
# Manual punishment types (ordinals 0-5):
#   0: Kick, 1: Manual Mute, 2: Manual Ban, 3: Security Ban, 4: Linked Ban, 5: Blacklist
# Dynamic punishment types start at ordinal 6+
#
# Structure:
#   public_notification: Single message shown to all players
#   player_notification: List of strings shown to the punished player (joined by \n)
#   Available placeholders:
#     {target} - The player's name (usually "You" for player notifications)
#     {reason} - The punishment reason
#     {duration} - Duration formatted (e.g., "7d 3h" or "permanent")
#     {description} - Same as reason
#     {appeal_url} - Full appeal URL (api.url + /appeal)
#     {id} - The punishment ID
#     {temp} - "temporarily" or "permanently"
#     {issued} - Issue date in MM/DD/YY HH:MM format
#     {player_description} - Player-facing description from punishment type config
#     {will_expire} - Empty if permanent, or "\nThis ban/mute will expire in {duration}" if timed
#     {issuer} - Staff name who issued the punishment
#     {tense} - "have been" or "are" depending on context
#     {tense2} - "has been" or "is" depending on context

punishments:
  public_notification:
    ban_default: "&cИгрок {target} забанен."
    mute_default: "&cИгрок {target} замучен."
    kick_default: "&cИгрок {target} кикнут."
    default: "&cИгрок {target} наказан."
  mute_fallback: "&cВы замучены!"
  player_notification:
    ban_default: "&cВы {tense} забанены (#{id})."
    mute_default: "&cВы {tense} замучены (#{id})."
    kick_default: "&cВы были кикнуты (#{id})."
    default: "&cВы {tense} наказаны (#{id})."

punishment_types:
  ordinal_0: # Kick
    public_notification: "&cИгрок {target} кикнут."
    player_notification:
      - "&c&lВы были кикнуты с сервера."
      - "&f{reason} &7(#{id})"

  ordinal_1: # Manual Mute
    public_notification: "&cИгрок {target} замучен."
    player_notification:
      - ""
      - "&cВы {tense} {temp} замучены{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{reason}"
      - ""

  ordinal_2: # Manual Ban
    public_notification: "&cИгрок {target} забанен."
    player_notification:
      - "&c&lВы {tense} {temp} забанены за:"
      - ""
      - "&f{reason}"
      - "&7{will_expire}"
      - "&7Считаете это ошибкой? Подайте апелляцию на {appeal_url}, указав ID #{id}."

  # Manual punishment types
  ordinal_3:  # Security Ban
    public_notification: "&cИгрок {target} забанен."
    player_notification:
      - "&c&lВаш аккаунт {tense2} ограничен из соображений безопасности."
      - "&fНа вашем аккаунте обнаружена подозрительная активность. Защитите свой аккаунт и подайте апелляцию на {appeal_url}, указав ID #{id}."

  ordinal_4:  # Linked Ban
    public_notification: "&cИгрок {target} забанен."
    player_notification:
      - "&c&lВаш аккаунт {tense2} связан с забаненным аккаунтом."
      - ""
      - "&fОбход банов через альтернативные аккаунты или передача своего аккаунта другим строго запрещены."
      - ""
      - "&7Этот бан будет автоматически снят по истечении связанного бана."
      - "&7Считаете это ошибкой? Подайте апелляцию на {appeal_url}, указав ID #{id}"

  ordinal_5:  # Blacklist
    public_notification: "&cИгрок {target} внесён в чёрный список."
    player_notification:
      - "&cВы {tense} внесены в чёрный список"
      - "&7ID: #{id}"

  ordinal_6: # Chat abuse
    public_notification: "&cИгрок {target} замучен за нарушения в чате."
    player_notification:
      - ""
      - "&cВы {tense} {temp} замучены{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""
  ordinal_7: # anti social
    public_notification: "&cИгрок {target} замучен за антисоциальное поведение."
    player_notification:
      - ""
      - "&cВы {tense} {temp} замучены{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""

  ordinal_8: # targeting
    public_notification: "&cИгрок {target} забанен за травлю."
    player_notification:
      - "&c&lВы {tense} {temp} забанены за:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Считаете это ошибкой? Подайте апелляцию на {appeal_url}, указав ID #{id}."

  ordinal_9: # bad content
    public_notification: "&cИгрок {target} забанен за неприемлемый контент."
    player_notification:
      - "&c&lВы {tense} {temp} забанены за:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Считаете это ошибкой? Подайте апелляцию на {appeal_url}, указав ID #{id}."

  ordinal_10: # Bad username
    public_notification: "&cИгрок {target} забанен."
    player_notification:
      - "&c&lВы {tense} забанены из-за вашего никнейма в Minecraft."
      - ""
      - "&f{reason}"
      - ""
      - "&7Этот бан будет автоматически снят после смены никнейма."
      - "&7Считаете это ошибкой? Подайте апелляцию на {appeal_url}, указав ID #{id}"

  ordinal_11: # Bad skin
    public_notification: "&cИгрок {target} забанен."
    player_notification:
      - "&c&lВы {tense} забанены из-за вашего скина в Minecraft."
      - ""
