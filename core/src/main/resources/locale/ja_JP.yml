validation:
  single_severity_error: "&c単一重大度の処罰タイプ『{type}』には重大度を設定できません。この処罰タイプの重大度は1段階のみです。"
  permanent_skin_change_error: "&cスキン変更まで有効な処罰タイプ『{type}』には重大度を設定できません。"
  permanent_username_change_error: "&cユーザー名変更まで有効な処罰タイプ『{type}』には重大度を設定できません。"
  alt_blocking_not_supported: "&c処罰タイプ『{type}』はサブアカウントのブロックに対応していません。"
  stat_wiping_not_supported: "&c処罰タイプ『{type}』は統計データの初期化に対応していません。"

# Punishment placeholder words
# These are substituted into punishment messages as {tense}, {tense2}, and {temp}
punishment_words:
  # {tense} - used in player-facing messages (e.g., "You {tense} banned")
  tense_default: "されました"
  tense_active: "されています"
  # {tense2} - used in player-facing messages (e.g., "Your account {tense2} restricted")
  tense2_default: "されました"
  tense2_active: "されています"
  # {temp} - used in player-facing messages (e.g., "You have been {temp} banned")
  temporarily: "一時的に"
  permanently: "永久に"
  # {will_expire} - appended to timed ban/mute notifications; {type} is ban/mute/punishment, {duration} is the remaining time
  will_expire: "\n&7この{type}はあと&f{duration}&7で解除されます。"
  duration_formatted: "\n&7この{type}はあと{duration}で解除されます"
  mute_duration_formatted: "（{duration}）"
  # {for_duration} - appended to timed mute notifications; the value carries its own leading space
  for_duration: "（{duration}）"
  # Localized words injected as {type} into will_expire/duration_formatted
  type_ban: "BAN"
  type_mute: "ミュート"
  type_punishment: "処罰"
  # Shown in the {duration} slot for permanent punishments; config.yml locale_config.duration_format.permanent overrides it when set
  duration_permanent: "永久"

# Punishment Type Specific Messages
# Format: punishment_types.ordinal_<ordinal_number>
# Manual punishment types (ordinals 0-5):
#   0: Kick, 1: Manual Mute, 2: Manual Ban, 3: Security Ban, 4: Linked Ban, 5: Blacklist
# Dynamic punishment types start at ordinal 6+
# 
# Structure:
#   public_notification: Single message shown to all players
#   player_notification: List of strings shown to the punished player (joined by \n)
#   Available placeholders:
#     {target} - The player's name (usually "You" for player notifications)
#     {reason} - The punishment reason
#     {duration} - Duration formatted (e.g., "7d 3h" or "permanent")
#     {description} - Same as reason
#     {appeal_url} - Full appeal URL (api.url + /appeal)
#     {id} - The punishment ID
#     {temp} - "temporarily" or "permanently"
#     {issued} - Issue date in MM/DD/YY HH:MM format
#     {player_description} - Player-facing description from punishment type config
#     {will_expire} - Empty if permanent, or "\nThis ban/mute will expire in {duration}" if timed
#     {issuer} - Staff name who issued the punishment
#     {tense} - "have been" or "are" depending on context
#     {tense2} - "has been" or "is" depending on context

punishments:
  public_notification:
    ban_default: "&c{target}がBANされました。"
    mute_default: "&c{target}がミュートされました。"
    kick_default: "&c{target}がキックされました。"
    default: "&c{target}が処罰されました。"
  mute_fallback: "&cあなたはミュートされています！"
  player_notification:
    ban_default: "&cあなたはBAN{tense}（#{id}）。"
    mute_default: "&cあなたはミュート{tense}（#{id}）。"
    kick_default: "&cあなたはキックされました（#{id}）。"
    default: "&cあなたは処罰{tense}（#{id}）。"

punishment_types:
  ordinal_0: # Kick
    public_notification: "&c{target}がキックされました。"
    player_notification:
      - "&c&lサーバーからキックされました。"
      - "&f{reason} &7(#{id})"

  ordinal_1: # Manual Mute
    public_notification: "&c{target}がミュートされました。"
    player_notification:
      - ""
      - "&cあなたは{temp}ミュート{tense}{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{reason}"
      - ""

  ordinal_2: # Manual Ban
    public_notification: "&c{target}がBANされました。"
    player_notification:
      - "&c&lあなたは以下の理由により{temp}BAN{tense}:"
      - ""
      - "&f{reason}"
      - "&7{will_expire}"
      - "&7誤りだと思われる場合は、{appeal_url}にてID #{id}で異議を申し立ててください。"

  # Manual punishment types
  ordinal_3:  # Security Ban
    public_notification: "&c{target}がBANされました。"
    player_notification:
      - "&c&lセキュリティ上の懸念により、あなたのアカウントは制限{tense2}。"
      - "&fあなたのアカウントで不審な活動が検出されました。アカウントの安全を確保したうえで、{appeal_url}にてID #{id}で異議を申し立ててください。"

  ordinal_4:  # Linked Ban
    public_notification: "&c{target}がBANされました。"
    player_notification:
      - "&c&lあなたのアカウントとBAN済みアカウントとの関連が検出{tense2}。"
      - ""
      - "&fサブアカウントを利用したBAN回避、およびアカウントの共有は固く禁止されています。"
      - ""
      - "&7このBANは、関連するBANが解除された時点で自動的に解除されます。"
      - "&7誤りだと思われる場合は、{appeal_url}にてID #{id}で異議を申し立ててください"

  ordinal_5:  # Blacklist
    public_notification: "&c{target}がブラックリストに登録されました。"
    player_notification:
      - "&cあなたはブラックリストに登録{tense}"
      - "&7ID: #{id}"

  ordinal_6: # Chat abuse
    public_notification: "&c{target}がチャットの悪用によりミュートされました。"
    player_notification:
      - ""
      - "&cあなたは{temp}ミュート{tense}{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""
  ordinal_7: # anti social
    public_notification: "&c{target}が迷惑行為によりミュートされました。"
    player_notification:
      - ""
      - "&cあなたは{temp}ミュート{tense}{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""

  ordinal_8: # targeting
    public_notification: "&c{target}が特定プレイヤーへの嫌がらせによりBANされました。"
    player_notification:
      - "&c&lあなたは以下の理由により{temp}BAN{tense}:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7誤りだと思われる場合は、{appeal_url}にてID #{id}で異議を申し立ててください。"

  ordinal_9: # bad content
    public_notification: "&c{target}が不適切なコンテンツによりBANされました。"
    player_notification:
      - "&c&lあなたは以下の理由により{temp}BAN{tense}:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7誤りだと思われる場合は、{appeal_url}にてID #{id}で異議を申し立ててください。"

  ordinal_10: # Bad username
    public_notification: "&c{target}がBANされました。"
    player_notification:
      - "&c&lあなたはMinecraftのユーザー名が原因でBAN{tense}。"
      - ""
      - "&f{reason}"
      - ""
      - "&7このBANは、ユーザー名を変更すると自動的に解除されます。"
      - "&7誤りだと思われる場合は、{appeal_url}にてID #{id}で異議を申し立ててください"

  ordinal_11: # Bad skin
    public_notification: "&c{target}がBANされました。"
    player_notification:
      - "&c&lあなたはMinecraftのスキンが原因でBAN{tense}。"
      - ""
      - "&f{reason}"
      - ""
      - "&7このBANは、スキンを変更すると自動的に解除されます。"
      - "&7誤りだと思われる場合は、{appeal_url}にてID #{id}で異議を申し立ててください"

  ordinal_12: # team abuse
    public_notification: "&c{target}がチームに関する不正行為によりBANされました。"
    player_notification:
      - "&c&lあなたは以下の理由により{temp}BAN{tense}:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7誤りだと思われる場合は、{appeal_url}にてID #{id}で異議を申し立ててください。"

  ordinal_13: # game abuse
    public_notification: "&c{target}がゲームの不正利用によりBANされました。"
    player_notification:
      - "&c&lあなたは以下の理由により{temp}BAN{tense}:"
      - ""
