# Punishment placeholder words
# These are substituted into punishment messages as {tense}, {tense2}, and {temp}
punishment_words:
  # {tense} - used in player-facing messages (e.g., "You {tense} banned")
  tense_default: "किए गए हैं"
  tense_active: "हैं"
  # {tense2} - used in player-facing messages (e.g., "Your account {tense2} restricted")
  tense2_default: "किया गया है"
  tense2_active: "है"
  # {temp} - used in player-facing messages (e.g., "You have been {temp} banned")
  temporarily: "अस्थायी रूप से"
  permanently: "स्थायी रूप से"
  # {will_expire} - appended to timed ban/mute notifications; {type} is ban/mute/punishment, {duration} is the remaining time
  will_expire: "\n&7इस {type} की समाप्ति &f{duration}&7 में होगी।"
  duration_formatted: "\n&7इस {type} की समाप्ति {duration} में होगी"
  mute_duration_formatted: " ({duration} के लिए)"
  # {for_duration} - appended to timed mute notifications; the value carries its own leading space
  for_duration: " ({duration} के लिए)"
  # Localized words injected as {type} into will_expire/duration_formatted
  type_ban: "बैन"
  type_mute: "म्यूट"
  type_punishment: "सज़ा"
  # Shown in the {duration} slot for permanent punishments; config.yml locale_config.duration_format.permanent overrides it when set
  duration_permanent: "स्थायी"

# Punishment Type Specific Messages
# Format: punishment_types.ordinal_<ordinal_number>
# Manual punishment types (ordinals 0-5):
#   0: Kick, 1: Manual Mute, 2: Manual Ban, 3: Security Ban, 4: Linked Ban, 5: Blacklist
# Dynamic punishment types start at ordinal 6+
# 
# Structure:
#   public_notification: Single message shown to all players
#   player_notification: List of strings shown to the punished player (joined by \n)
#   Available placeholders:
#     {target} - The player's name (usually "You" for player notifications)
#     {reason} - The punishment reason
#     {duration} - Duration formatted (e.g., "7d 3h" or "permanent")
#     {description} - Same as reason
#     {appeal_url} - Full appeal URL (api.url + /appeal)
#     {id} - The punishment ID
#     {temp} - "temporarily" or "permanently"
#     {issued} - Issue date in MM/DD/YY HH:MM format
#     {player_description} - Player-facing description from punishment type config
#     {will_expire} - Empty if permanent, or "\nThis ban/mute will expire in {duration}" if timed
#     {issuer} - Staff name who issued the punishment
#     {tense} - "have been" or "are" depending on context
#     {tense2} - "has been" or "is" depending on context

punishments:
  public_notification:
    ban_default: "&c{target} को बैन कर दिया गया है।"
    mute_default: "&c{target} को म्यूट कर दिया गया है।"
    kick_default: "&c{target} को किक कर दिया गया है।"
    default: "&c{target} को सज़ा दी गई है।"
  mute_fallback: "&cआप म्यूट हैं!"
  player_notification:
    ban_default: "&cआप बैन {tense} (#{id})।"
    mute_default: "&cआप म्यूट {tense} (#{id})।"
    kick_default: "&cआपको किक कर दिया गया है (#{id})।"
    default: "&cआप दंडित {tense} (#{id})।"

punishment_types:
  ordinal_0: # Kick
    public_notification: "&c{target} को किक कर दिया गया है।"
    player_notification:
      - "&c&lआपको सर्वर से किक कर दिया गया।"
      - "&f{reason} &7(#{id})"

  ordinal_1: # Manual Mute
    public_notification: "&c{target} को म्यूट कर दिया गया है।"
    player_notification:
      - ""
      - "&cआप {temp} म्यूट {tense}{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{reason}"
      - ""

  ordinal_2: # Manual Ban
    public_notification: "&c{target} को बैन कर दिया गया है।"
    player_notification:
      - "&c&lआप {temp} बैन {tense}, कारण:"
      - ""
      - "&f{reason}"
      - "&7{will_expire}"
      - "&7क्या यह गलती है? {appeal_url} पर ID #{id} के साथ अपील करें।"

  # Manual punishment types
  ordinal_3:  # Security Ban
    public_notification: "&c{target} को बैन कर दिया गया है।"
    player_notification:
      - "&c&lसुरक्षा कारणों से आपका अकाउंट प्रतिबंधित {tense2}।"
      - "&fआपके अकाउंट पर संदिग्ध गतिविधि पाई गई है। कृपया अपना अकाउंट सुरक्षित करें और {appeal_url} पर ID #{id} के साथ अपील खोलें।"

  ordinal_4:  # Linked Ban
    public_notification: "&c{target} को बैन कर दिया गया है।"
    player_notification:
      - "&c&lआपका अकाउंट एक बैन किए गए अकाउंट से लिंक {tense2}।"
      - ""
      - "&fऑल्ट अकाउंट का इस्तेमाल करके बैन से बचना या अपना अकाउंट साझा करना पूरी तरह प्रतिबंधित है।"
      - ""
      - "&7लिंक किया गया बैन खत्म होते ही यह बैन अपने आप हटा दिया जाएगा।"
      - "&7क्या यह गलती है? {appeal_url} पर ID #{id} के साथ अपील करें"

  ordinal_5:  # Blacklist
    public_notification: "&c{target} को ब्लैकलिस्ट कर दिया गया है।"
    player_notification:
      - "&cआप ब्लैकलिस्ट {tense}"
