    player_notification:
      - "&c&lVocê {tense} {temp} banido por:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Isso é um erro? Faça uma apelação em {appeal_url} usando o ID #{id}."

  ordinal_15: # game trading
    public_notification: "&c{target} foi banido por comércio irregular de itens do jogo."
    player_notification:
      - "&c&lVocê {tense} {temp} banido por:"
      - ""
