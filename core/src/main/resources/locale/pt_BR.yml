# Punishment type validation messages
validation:
  single_severity_error: "&cNão é possível definir a severidade no tipo de punição de severidade única '{type}'. Esse tipo de punição tem apenas um nível de severidade."
  permanent_skin_change_error: "&cNão é possível definir a severidade no tipo de punição permanente até a troca de skin '{type}'."
  permanent_username_change_error: "&cNão é possível definir a severidade no tipo de punição permanente até a troca de nome de usuário '{type}'."
  alt_blocking_not_supported: "&cO bloqueio de alts não é suportado pelo tipo de punição '{type}'."
  stat_wiping_not_supported: "&cA limpeza de estatísticas não é suportada pelo tipo de punição '{type}'."

# Punishment placeholder words
# These are substituted into punishment messages as {tense}, {tense2}, and {temp}
punishment_words:
  # {tense} - used in player-facing messages (e.g., "You {tense} banned")
  tense_default: "foi"
  tense_active: "está"
  # {tense2} - used in player-facing messages (e.g., "Your account {tense2} restricted")
  tense2_default: "foi"
  tense2_active: "está"
  # {temp} - used in player-facing messages (e.g., "You have been {temp} banned")
  temporarily: "temporariamente"
  permanently: "permanentemente"
  # {will_expire} - appended to timed ban/mute notifications; {type} is ban/mute/punishment, {duration} is the remaining time
  will_expire: "\n&7O tempo de {type} termina em &f{duration}&7."
  duration_formatted: "\n&7O tempo de {type} termina em {duration}"
  mute_duration_formatted: " por {duration}"
  # {for_duration} - appended to timed mute notifications; the value carries its own leading space
  for_duration: " por {duration}"
  # Localized words injected as {type} into will_expire/duration_formatted
  type_ban: "banimento"
  type_mute: "mute"
  type_punishment: "punição"
  # Shown in the {duration} slot for permanent punishments; config.yml locale_config.duration_format.permanent overrides it when set
  duration_permanent: "permanente"

# Punishment Type Specific Messages
# Format: punishment_types.ordinal_<ordinal_number>
# Manual punishment types (ordinals 0-5):
#   0: Kick, 1: Manual Mute, 2: Manual Ban, 3: Security Ban, 4: Linked Ban, 5: Blacklist
# Dynamic punishment types start at ordinal 6+
#
# Structure:
#   public_notification: Single message shown to all players
#   player_notification: List of strings shown to the punished player (joined by \n)
#   Available placeholders:
#     {target} - The player's name (usually "You" for player notifications)
#     {reason} - The punishment reason
#     {duration} - Duration formatted (e.g., "7d 3h" or "permanent")
#     {description} - Same as reason
#     {appeal_url} - Full appeal URL (api.url + /appeal)
#     {id} - The punishment ID
#     {temp} - "temporarily" or "permanently"
#     {issued} - Issue date in MM/DD/YY HH:MM format
#     {player_description} - Player-facing description from punishment type config
#     {will_expire} - Empty if permanent, or "\nThis ban/mute will expire in {duration}" if timed
#     {issuer} - Staff name who issued the punishment
#     {tense} - "have been" or "are" depending on context
#     {tense2} - "has been" or "is" depending on context

punishments:
  public_notification:
    ban_default: "&c{target} foi banido."
    mute_default: "&c{target} foi mutado."
    kick_default: "&c{target} foi expulso."
    default: "&c{target} foi punido."
  mute_fallback: "&cVocê está mutado!"
  player_notification:
    ban_default: "&cVocê {tense} banido (#{id})."
    mute_default: "&cVocê {tense} mutado (#{id})."
    kick_default: "&cVocê foi expulso (#{id})."
    default: "&cVocê {tense} punido (#{id})."

punishment_types:
  ordinal_0: # Kick
    public_notification: "&c{target} foi expulso."
    player_notification:
      - "&c&lVocê foi expulso do servidor."
      - "&f{reason} &7(#{id})"

  ordinal_1: # Manual Mute
    public_notification: "&c{target} foi mutado."
    player_notification:
      - ""
      - "&cVocê {tense} {temp} mutado{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{reason}"
      - ""

  ordinal_2: # Manual Ban
    public_notification: "&c{target} foi banido."
    player_notification:
      - "&c&lVocê {tense} {temp} banido por:"
      - ""
      - "&f{reason}"
      - "&7{will_expire}"
      - "&7Isso é um erro? Faça uma apelação em {appeal_url} usando o ID #{id}."

  # Manual punishment types
  ordinal_3:  # Security Ban
    public_notification: "&c{target} foi banido."
    player_notification:
      - "&c&lSua conta {tense2} restringida por questões de segurança."
      - "&fAtividade suspeita foi detectada na sua conta. Proteja sua conta e abra uma apelação em {appeal_url} usando o ID #{id}."

  ordinal_4:  # Linked Ban
    public_notification: "&c{target} foi banido."
    player_notification:
      - "&c&lSua conta {tense2} vinculada a uma conta banida."
      - ""
      - "&fBurlar banimentos usando contas alternativas ou compartilhar sua conta é estritamente proibido."
      - ""
      - "&7Este banimento será removido automaticamente quando o banimento vinculado terminar."
      - "&7Isso é um erro? Faça uma apelação em {appeal_url} usando o ID #{id}"

  ordinal_5:  # Blacklist
    public_notification: "&c{target} foi colocado na lista negra."
    player_notification:
      - "&cVocê {tense} incluído na lista negra"
      - "&7ID: #{id}"

  ordinal_6: # Chat abuse
    public_notification: "&c{target} foi mutado por abuso no chat."
    player_notification:
      - ""
      - "&cVocê {tense} {temp} mutado{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""
  ordinal_7: # anti social
    public_notification: "&c{target} foi mutado por comportamento antissocial."
    player_notification:
      - ""
      - "&cVocê {tense} {temp} mutado{for_duration}"
      - "&7{issued} | #{id} | {appeal_url}"
      - "&f{player_description}"
      - ""

  ordinal_8: # targeting
    public_notification: "&c{target} foi banido por perseguir outros jogadores."
    player_notification:
      - "&c&lVocê {tense} {temp} banido por:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Isso é um erro? Faça uma apelação em {appeal_url} usando o ID #{id}."

  ordinal_9: # bad content
    public_notification: "&c{target} foi banido por conteúdo inapropriado."
    player_notification:
      - "&c&lVocê {tense} {temp} banido por:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Isso é um erro? Faça uma apelação em {appeal_url} usando o ID #{id}."

  ordinal_10: # Bad username
    public_notification: "&c{target} foi banido."
    player_notification:
      - "&c&lVocê {tense} banido por causa do seu nome de usuário do Minecraft."
      - ""
      - "&f{reason}"
      - ""
      - "&7Este banimento será removido automaticamente quando você mudar seu nome de usuário."
      - "&7Isso é um erro? Faça uma apelação em {appeal_url} usando o ID #{id}"

  ordinal_11: # Bad skin
    public_notification: "&c{target} foi banido."
    player_notification:
      - "&c&lVocê {tense} banido por causa da sua skin do Minecraft."
      - ""
      - "&f{reason}"
      - ""
      - "&7Este banimento será removido automaticamente quando você mudar sua skin."
      - "&7Isso é um erro? Faça uma apelação em {appeal_url} usando o ID #{id}"

  ordinal_12: # team abuse
    public_notification: "&c{target} foi banido por abuso de equipe."
    player_notification:
      - "&c&lVocê {tense} {temp} banido por:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Isso é um erro? Faça uma apelação em {appeal_url} usando o ID #{id}."

  ordinal_13: # game abuse
    public_notification: "&c{target} foi banido por abuso das mecânicas do jogo."
    player_notification:
      - "&c&lVocê {tense} {temp} banido por:"
      - ""
      - "&f{player_description}"
      - "&7{will_expire}"
      - "&7Isso é um erro? Faça uma apelação em {appeal_url} usando o ID #{id}."

  ordinal_14: # cheating
