# Warning Command Messages
warn:
  player_message: "&c&lVocê recebeu um aviso de {issuer}.\n&fMotivo: &7{reason}\n&7Leia as regras do servidor e ajuste seu comportamento."
  success: "&aAviso aplicado com sucesso em &f{target}&a. Motivo: &7{reason}"
  staff_notification: "&7&o[{issuer}: avisou {target} por {reason}&7&o]"
  error: "&cFalha ao criar o aviso: {error}"

# Menu Item Localization
# These define titles and lore for items in inspect menus
# Available placeholders vary by item type and are documented below
menus:
  # Player head in inspect menus
  player_head:
    title: "&6Informações de {player_name}"
    lore:
      - "&8{uuid}"
      - "&f "
      - "&7Primeiro login: &f{first_login}"
      - "&7Online: {is_online} ({last_seen_or_session_time} em {server})"
      - "&7Tempo de jogo: &f{playtime}"
      - "&7IP real registrado: &f{real_ip_logged}"
      - "&7Região: &f{region} (País: {country})"
      - "&7Banido: &f{is_banned}"
      - "&7Mutado: &f{is_muted}"
      - ""
      - "&eClique esquerdo para definir {player_name} como alvo"

  # Punishment history items
  history_item:
    title_active: "&f&l{punishment_type} &f({initial_duration_if_not_kick}{space_ban_mute_or_kick})"
    title_inactive: "&m&f&l{punishment_type} &f({initial_duration_if_not_kick}{space_ban_mute_or_kick})"
    lore:
      - "&7{status_line}"
      - "&f "
      - "{notes}"
      - "&f "
      - "&7Servidor: &f{issued_server}"
      - "&7ID: &c{punishment_id}"
      - "&bClique para modificar esta punição."
    status_active: "&7Expira em {expiry}."
    status_inactive: "&7Expirou há {expired}."
    status_pardoned: "&7Perdoada há {pardoned}."
    status_permanent: "&7&7Esta punição permanente nunca expira."
    status_unstarted: "&7Punição ainda não iniciada."
    note_format: "&e{note_date} {note_issuer}&f: {note}"

  # Recent punishments items (includes target player info)
  recent_item:
    title_active: "&f&l{punishment_type} &f({initial_duration_if_not_kick}{space_ban_mute_or_kick})"
    title_inactive: "&m&f&l{punishment_type} &f({initial_duration_if_not_kick}{space_ban_mute_or_kick})"
    lore:
      - "&7Jogador: &f{player}"
      - "&7{status_line}"
      - "&f "
      - "{notes}"
      - "&f "
      - "&7Servidor: &f{issued_server}"
      - "&7ID: &c{punishment_id}"
      - "&bClique para modificar esta punição."

  # Note items
  note_item:
    title: "&e{date} {author}"
    lore:
      - "&f{content}"
      - "&f "
      - "&eClique para ver a nota no chat"

  # Report items
  report_item:
    title: "&e{date} {id} ({status}&e)"
    lore:
      - "&7Denunciado por &a{reporter} &7({type})"
      - "&f "
      - "{content}"
      - "&f "
      - "&cClique com o esquerdo para inspecionar o jogador"
      - "&aClique com o direito para descartar a denúncia"

  # Alt account items
  alt_item:
    title: "{color}{player_name}"
    lore:
      - "&8{uuid}"
      - "&f "
      - "&7Online: {is_online} ({last_seen_or_session_time} em {server})"
      - "&7IP real registrado: {real_ip}"
      - "&7Primeiro login: &f{first_login}"
      - "&7{punishments}"
      - "&f "
      - "&eClique para inspecionar {player_name}"
    punishment_line_active_true:
      - "&7Punições ativas ({active_count}): &f"
      - "{active_punishment_list}"
    punishment_line_active_false:
      - "&7Punições ativas: &f0"
      - "&7Punições inativas: &f{inactive_count}"
    active_punishment_format: "&7- &e#{punishment_id} {punishment_date}: {punishment_type} ({punishment_remaining})"


  # Empty placeholders for lists
  empty:
    history: "Sem histórico de punições"
    notes: "Sem notas da staff"
    reports: "Nenhuma denúncia registrada"
    alts: "Nenhuma conta vinculada"
    tickets: "Nenhum ticket"
    staff_reports: "Nenhuma denúncia"

  # Staff menu - Tickets
  ticket_item:
    title: "&6Ticket #{id}"
    lore:
      - "&7Jogador: &f{player}"
      - "&7Título: &f{title}"
      - "&7Criado em: &f{date}"
      - "&7Status: {status}"
      - "&f "
      - "&eClique para abrir no painel"

  # Staff menu - Reports
  staff_report_item:
    title: "&e{date} {id} ({status}&e)"
    lore:
      - "&c{reported}&7 denunciado por &a{reporter} &7({type})"
      - "&f "
      - "{content}"
      - "&f "
      - "&cClique com o esquerdo para inspecionar o jogador"
      - "&aClique com o direito para descartar a denúncia"
  linked_ticket_item:
    title: "&e{date} {id} ({status}&e)"
    lore:
      - "&7{title}"
      - "&f "
      - "{content}"
  link_report_item_unselected:
    title: "&e{date} {id}"
    lore:
      - "&7Denunciado por &a{reporter} &7({type})"
      - "&f "
      - "{content}"
      - "&f "
      - "&eClique para selecionar"
  link_report_item_selected:
    title: "&a{date} {id}"
    lore:
      - "&7Denunciado por &a{reporter} &7({type})"
      - "&f "
      - "{content}"
      - "&f "
      - "&eClique para desmarcar"

  # Staff Members Menu (lore template for each staff entry)
  # Placeholders: {display_name}, {online_color}, {role}, {minecraft_username},
  #   {online_status}, {session_duration}, {last_seen}, {playtime}, {punishments_count}
  staff_members:
    title: "&e{panel_name}"
    lore:
      - "&7Cargo: &f{role}"
      - "&7Minecraft: &f{minecraft_username}"
      - ""
      - "&7Online: {is_online} ({last_seen_or_session_time} em {server})"
      - "&7Tempo de jogo: &f{playtime}"
      - "&7Punições aplicadas: &f{punishments_count}"

  notes:
    created: "&aNota criada com sucesso!"
    create_failed: "&cFalha ao criar a nota."
    cancelled: "&7Criação da nota cancelada."
  modify_punishment:
    no_permission_tickets: "&cVocê não tem permissão para modificar tickets vinculados."
    no_changes: "&7Nenhuma alteração nos tickets vinculados."
    tickets_updated: "&aTickets vinculados atualizados com sucesso!"
    tickets_update_failed: "&cFalha ao atualizar os tickets vinculados."

  # Online Players Menu (lore template for each player entry)
  # Placeholders: {player_name}, {session_duration}, {total_playtime}, {punishments}, {report_count}
  online_players:
    title: "&6{player_name}"
    lore:
      - "&7Sessão: &f{session_duration}"
      - "&7Tempo total de jogo: &f{total_playtime}"
      - "&7Punições: &f{punishments}"
      - ""
      - "&7Denúncias ({report_count}):"
      - "{report-list}"
      - ""
      - "&cClique com o esquerdo para inspecionar"
      - "&aClique com o direito para definir como alvo"
    # Placeholders: {date}, {details}, {reporter}
    report_entry: " &6- &e{date} {reporter}: &f{details}"
    reports_more: " &e... e mais {count}"
    no_reports: " &eNenhuma denúncia"

# Help Command
# Set usage to "" to hide a command from the help list (e.g. if you disabled it).
help:
  header: "&a&lmodl.gg &av{version} &f- &eLista de Comandos"
  entry: "&f/{command} &7- {description}"
  footer: "&ePágina {page}/{total_pages}. Use &a/modl help {next_page}&e para ver a próxima página."
  no_more_pages: "&7Não há mais páginas."
  player_commands:
    iammuted:
      usage: "iammuted <jogador>"
      description: "Avisar alguém de que você está mutado"
    standing:
      usage: "standing"
      description: "Ver sua situação de punições"
    report:
      usage: "report <jogador> <motivo>"
      description: "Denunciar um jogador"
    chatreport:
      usage: "chatreport <jogador>"
      description: "Denunciar o chat de um jogador"
    claimticket:
      usage: "claimticket <id>"
      description: "Vincular um ticket à sua conta"
    apply:
      usage: "apply"
      description: "Candidatar-se a uma vaga na staff"
    bugreport:
      usage: "bugreport"
      description: "Reportar um bug"
    support:
      usage: "support"
      description: "Abrir um ticket de suporte"
  staff_commands:
    staffmenu:
      usage: "staffmenu"
      description: "Abrir o menu da staff"
    inspect:
      usage: "inspect <jogador> [-p]"
      description: "Abrir o menu de inspeção do jogador (-p para texto)"
    history:
      usage: "history <jogador> [-p [página]]"
      description: "Abrir o histórico do jogador (-p para texto)"
    notes:
      usage: "notes <jogador> [-p [página]]"
      description: "Abrir as notas do jogador (-p para texto)"
    alts:
      usage: "alts <jogador> [-p [página]]"
      description: "Abrir as contas alt do jogador (-p para texto)"
    reports:
      usage: "reports [jogador] [-p [página]]"
      description: "Abrir o menu de denúncias (-p para texto)"
    punish:
      usage: "punish <jogador> [tipo] [motivo]"
      description: "Aplicar uma punição"
    ban:
      usage: "ban <jogador> [duração] [motivo]"
      description: "Banir um jogador"
    mute:
      usage: "mute <jogador> [duração] [motivo]"
      description: "Mutar um jogador"
    kick:
      usage: "kick <jogador> [motivo]"
      description: "Expulsar um jogador"
    blacklist:
      usage: "blacklist <jogador> [motivo]"
      description: "Colocar um jogador na lista negra"
    pardon:
      usage: "pardon <jogador>"
      description: "Perdoar TODAS as punições ativas"
    unban:
      usage: "unban <jogador>"
      description: "Perdoar o ban ativo ou o mais antigo ainda não iniciado"
    unmute:
      usage: "unmute <jogador>"
      description: "Perdoar o mute ativo ou o mais antigo ainda não iniciado"
    replay:
      usage: "replay <status|capture> [jogador]"
      description: "Gerenciar as gravações de replay"
    modl_reload:
      usage: "modl reload"
      description: "Recarregar a configuração"

